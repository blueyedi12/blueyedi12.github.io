<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>CyberSnake IO</title>
  <style>
    :root {
      --bg: #070913;
      --panel: rgba(15, 23, 42, 0.85);
      --ink: #f8fafc;
      --glow-cyan: #4be3d8;
      --glow-pink: #ff2a85;
      --glow-gold: #e3b74b;
      --border: rgba(255, 255, 255, 0.12);
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(7, 9, 19, 0.75);
      backdrop-filter: blur(8px);
      z-index: 10;
      transition: opacity 0.3s ease;
    }

    .hidden {
      display: none !important;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px 32px;
      width: 360px;
      max-width: 90vw;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 2rem;
      letter-spacing: 2px;
      color: var(--glow-cyan);
      text-shadow: 0 0 12px rgba(75, 227, 216, 0.4);
    }

    p {
      color: #94a3b8;
      font-size: 0.9rem;
      margin-bottom: 20px;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
      font-size: 1rem;
      text-align: center;
      margin-bottom: 16px;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--glow-cyan);
    }

    .btn-group {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    .btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.1);
      color: var(--ink);
      transition: all 0.2s;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .btn.active {
      background: var(--glow-cyan);
      color: #000;
      box-shadow: 0 0 10px rgba(75, 227, 216, 0.4);
    }

    .btn-primary {
      width: 100%;
      padding: 14px;
      background: var(--glow-pink);
      color: #fff;
      font-size: 1.1rem;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(255, 42, 133, 0.4);
    }

    .btn-primary:hover {
      transform: translateY(-1px);
    }

    /* Skins / Shop grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 20px;
      max-height: 200px;
      overflow-y: auto;
    }

    .skin-item {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.03);
    }

    .skin-item.selected {
      border-color: var(--glow-cyan);
      background: rgba(75, 227, 216, 0.1);
    }

    .skin-preview {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      margin: 0 auto 6px;
    }

    /* HUD elements */
    .hud {
      position: absolute;
      top: 16px;
      left: 16px;
      pointer-events: none;
      z-index: 5;
    }

    .hud-box {
      background: var(--panel);
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 1.2rem;
    }

    .hud-box.boosting {
      color: var(--glow-pink);
      border-color: var(--glow-pink);
    }

    .gem-hud {
      position: absolute;
      top: 16px;
      right: 16px;
      background: var(--panel);
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 700;
      color: var(--glow-gold);
    }

    .leaderboard {
      position: absolute;
      top: 64px;
      right: 16px;
      background: var(--panel);
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 8px;
      width: 160px;
      font-size: 0.85rem;
    }

    .leaderboard h3 {
      margin: 0 0 8px;
      font-size: 0.9rem;
      text-transform: uppercase;
      color: #94a3b8;
    }

    .leaderboard .row-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    /* Touch Controls */
    #joystick {
      position: absolute;
      bottom: 40px;
      left: 40px;
      width: 100px;
      height: 100px;
      border: 2px dashed rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      touch-action: none;
    }

    #stick {
      position: absolute;
      top: 30px;
      left: 30px;
      width: 40px;
      height: 40px;
      background: var(--glow-cyan);
      border-radius: 50%;
      opacity: 0.6;
    }

    #boostBtn {
      position: absolute;
      bottom: 40px;
      right: 40px;
      width: 70px;
      height: 70px;
      background: var(--glow-pink);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      box-shadow: 0 0 15px rgba(255, 42, 133, 0.4);
      touch-action: none;
    }
  </style>
</head>
<body>

  <canvas id="canvas"></canvas>

  <!-- HUD -->
  <div id="hud" class="hud hidden">
    <div id="lenHud" class="hud-box">10</div>
    <div id="boostTag" style="font-size: 0.7rem; color: var(--glow-pink); display: none;">BOOSTING</div>
  </div>

  <div id="gemHud" class="gem-hud hidden">💎 <span id="gemCount">0</span></div>

  <div id="leaderboard" class="leaderboard hidden">
    <h3>Top CyberSnakes</h3>
    <div id="lbList"></div>
  </div>

  <!-- Mobile Controls -->
  <div id="joystick" class="hidden"><div id="stick"></div></div>
  <div id="boostBtn" class="hidden">⚡</div>

  <!-- Main Menu Overlay -->
  <div id="menuScreen" class="overlay">
    <div class="card">
      <h1>CYBERSNAKE</h1>
      <p>Eat food. Encircle foes. Collect gems.</p>
      
      <input type="text" id="playerName" placeholder="Enter Name" maxlength="12" value="Player1">

      <div class="btn-group">
        <button id="modePc" class="btn active">PC (Mouse)</button>
        <button id="modeMob" class="btn">Mobile</button>
      </div>

      <div class="btn-group">
        <button id="openSkins" class="btn">Skins</button>
        <button id="openShop" class="btn">Shop</button>
      </div>

      <button id="startBtn" class="btn-primary">PLAY NOW</button>
    </div>
  </div>

  <!-- Skins Overlay -->
  <div id="skinsScreen" class="overlay hidden">
    <div class="card">
      <h2>Select Skin</h2>
      <div id="skinGrid" class="grid"></div>
      <button id="closeSkins" class="btn-primary">Back</button>
    </div>
  </div>

  <!-- Shop Overlay -->
  <div id="shopScreen" class="overlay hidden">
    <div class="card">
      <h2>Gem Shop</h2>
      <p>Use gems unlocked in gameplay!</p>
      <div id="shopGrid" class="grid"></div>
      <button id="closeShop" class="btn-primary">Back</button>
    </div>
  </div>

  <!-- Death Overlay -->
  <div id="deathScreen" class="overlay hidden">
    <div class="card">
      <h2 style="color: var(--glow-pink);">TERMINATED</h2>
      <p id="deathStats">Final Length: 0 — Earned 0 gems</p>
      <button id="restartBtn" class="btn-primary">PLAY AGAIN</button>
    </div>
  </div>

<script>
(() => {
  /* ============ GAME CONFIG & CONSTANTS ============ */
  const WORLD_R = 1800;
  const BASE_SPEED = 180;
  const BOOST_SPEED = 340;
  const SEG_SPACING = 8;
  const FOOD_COUNT = 300;
  const AI_COUNT = 12;

  const SKINS = [
    { id: 'cyan', name: 'Cyber Cyan', color: '#4be3d8', glow: '#4be3d8', price: 0 },
    { id: 'pink', name: 'Neon Pink', color: '#ff2a85', glow: '#ff2a85', price: 0 },
    { id: 'gold', name: 'Gilded Gem', color: '#e3b74b', glow: '#e3b74b', price: 25 },
    { id: 'matrix', name: 'Hacker Green', color: '#2be34b', glow: '#2be34b', price: 50 }
  ];

  const AI_NAMES = ["Viper", "NetRunner", "Byte", "Zero", "Glitch", "Circuit", "Pulse", "Node"];

  /* ============ STATE ============ */
  let state = {
    playerName: "Player1",
    mode: "pc",
    selectedSkin: "cyan",
    gemsTotal: parseInt(localStorage.getItem("cyberGems") || "0", 10),
    unlockedSkins: JSON.parse(localStorage.getItem("cyberSkins") || '["cyan", "pink"]')
  };

  let canvas, ctx;
  let running = false;
  let player = null;
  let snakes = [];
  let food = [];
  let gemsWorld = [];
  let runGems = 0;

  let mousePos = { x: 0, y: 0 };
  let joyActive = false;
  let joyDir = { x: 0, y: 0 };
  let touchBoosting = false;

  /* ============ UTILS ============ */
  const el = id => document.getElementById(id);
  const show = id => el(id).classList.remove('hidden');
  const hide = id => el(id).classList.add('hidden');
  const distSq = (x1, y1, x2, y2) => (x2 - x1) ** 2 + (y2 - y1) ** 2;

  /* ============ INITIALIZATION ============ */
  window.addEventListener('load', () => {
    canvas = el('canvas');
    ctx = canvas.getContext('2d');
    resize();
    window.addEventListener('resize', resize);

    initUI();
    saveState();
  });

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }

  function saveState() {
    localStorage.setItem("cyberGems", state.gemsTotal.toString());
    localStorage.setItem("cyberSkins", JSON.stringify(state.unlockedSkins));
    el('gemCount').textContent = state.gemsTotal;
  }

  /* ============ UI & INTERACTION ============ */
  function initUI() {
    el('playerName').addEventListener('input', e => state.playerName = e.target.value.trim() || "Player");

    el('modePc').addEventListener('click', () => {
      state.mode = 'pc';
      el('modePc').classList.add('active');
      el('modeMob').classList.remove('active');
    });

    el('modeMob').addEventListener('click', () => {
      state.mode = 'mobile';
      el('modeMob').classList.add('active');
      el('modePc').classList.remove('active');
    });

    el('startBtn').addEventListener('click', startGame);
    el('restartBtn').addEventListener('click', startGame);

    el('openSkins').addEventListener('click', () => { renderSkins(); show('skinsScreen'); });
    el('closeSkins').addEventListener('click', () => hide('skinsScreen'));

    el('openShop').addEventListener('click', () => { renderShop(); show('shopScreen'); });
    el('closeShop').addEventListener('click', () => hide('shopScreen'));

    // Input Listeners
    window.addEventListener('mousemove', e => {
      mousePos.x = e.clientX;
      mousePos.y = e.clientY;
    });

    window.addEventListener('mousedown', e => {
      if (state.mode === 'pc' && player && e.button === 0) player.boosting = true;
    });

    window.addEventListener('mouseup', e => {
      if (state.mode === 'pc' && player && e.button === 0) player.boosting = false;
    });

    // Mobile Controls
    const joystick = el('joystick');
    const stick = el('stick');
    const boostBtn = el('boostBtn');

    joystick.addEventListener('touchstart', e => {
      joyActive = true;
      updateJoystick(e.touches[0]);
    });

    joystick.addEventListener('touchmove', e => {
      if (joyActive) updateJoystick(e.touches[0]);
    });

    const resetJoy = () => {
      joyActive = false;
      joyDir = { x: 0, y: 0 };
      stick.style.transform = `translate(0px, 0px)`;
    };

    joystick.addEventListener('touchend', resetJoy);
    joystick.addEventListener('touchcancel', resetJoy);

    function updateJoystick(touch) {
      const rect = joystick.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      let dx = touch.clientX - cx;
      let dy = touch.clientY - cy;
      const d = Math.hypot(dx, dy);
      const maxR = 30;

      if (d > maxR) {
        dx = (dx / d) * maxR;
        dy = (dy / d) * maxR;
      }

      stick.style.transform = `translate(${dx}px, ${dy}px)`;
      joyDir.x = dx / maxR;
      joyDir.y = dy / maxR;
    }

    boostBtn.addEventListener('touchstart', e => {
      e.preventDefault();
      touchBoosting = true;
      if (player) player.boosting = true;
    });

    boostBtn.addEventListener('touchend', e => {
      e.preventDefault();
      touchBoosting = false;
      if (player) player.boosting = false;
    });
  }

  function renderSkins() {
    const grid = el('skinGrid');
    grid.innerHTML = '';
    SKINS.forEach(skin => {
      const unlocked = state.unlockedSkins.includes(skin.id);
      if (!unlocked) return;

      const div = document.createElement('div');
      div.className = `skin-item ${state.selectedSkin === skin.id ? 'selected' : ''}`;
      div.innerHTML = `
        <div class="skin-preview" style="background: ${skin.color}; box-shadow: 0 0 8px ${skin.glow}"></div>
        <div style="font-size:0.8rem; font-weight:bold;">${skin.name}</div>
      `;
      div.onclick = () => {
        state.selectedSkin = skin.id;
        renderSkins();
      };
      grid.appendChild(div);
    });
  }

  function renderShop() {
    const grid = el('shopGrid');
    grid.innerHTML = '';
    SKINS.forEach(skin => {
      const unlocked = state.unlockedSkins.includes(skin.id);
      const div = document.createElement('div');
      div.className = 'skin-item';
      div.innerHTML = `
        <div class="skin-preview" style="background: ${skin.color}; box-shadow: 0 0 8px ${skin.glow}"></div>
        <div style="font-size:0.8rem; font-weight:bold;">${skin.name}</div>
        <div style="font-size:0.75rem; color: var(--glow-gold); font-weight:bold;">
          ${unlocked ? 'UNLOCKED' : skin.price + ' 💎'}
        </div>
      `;

      if (!unlocked) {
        div.onclick = () => {
          if (state.gemsTotal >= skin.price) {
            state.gemsTotal -= skin.price;
            state.unlockedSkins.push(skin.id);
            saveState();
            renderShop();
          } else {
            alert('Not enough gems!');
          }
        };
      }
      grid.appendChild(div);
    });
  }

  /* ============ GAME OBJECTS ============ */
  function makeSnake(isPlayer, name, skinId) {
    const skin = SKINS.find(s => s.id === skinId) || SKINS[0];
    const angle = Math.random() * Math.PI * 2;
    const spawnR = Math.random() * (WORLD_R - 300);
    const headX = Math.cos(angle) * spawnR;
    const headY = Math.sin(angle) * spawnR;

    const segs = [];
    const initLen = 20;
    for (let i = 0; i < initLen * SEG_SPACING; i++) {
      segs.push({ x: headX - Math.cos(angle) * i, y: headY - Math.sin(angle) * i });
    }

    return {
      isPlayer,
      name,
      skin,
      segs,
      angle,
      targetAngle: angle,
      boosting: false,
      alive: true,
      turnSpeed: 4.5,
      width: 14
    };
  }

  function spawnFood(count) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const r = Math.sqrt(Math.random()) * (WORLD_R - 50);
      food.push({
        x: Math.cos(a) * r,
        y: Math.sin(a) * r,
        r: Math.random() * 2 + 3,
        color: `hsl(${Math.random() * 360}, 90%, 65%)`
      });
    }
  }

  function spawnGemsCluster(x, y, amount) {
    for (let i = 0; i < amount; i++) {
      gemsWorld.push({
        x: x + (Math.random() - 0.5) * 40,
        y: y + (Math.random() - 0.5) * 40,
        r: 6,
        t: Math.random() * Math.PI * 2
      });
    }
  }

  function aiName() {
    return AI_NAMES[Math.floor(Math.random() * AI_NAMES.length)];
  }

  /* ============ SIMULATION ============ */
  function updateSnake(s, dt) {
    if (!s.alive) return;

    // Steering Logic
    if (s.isPlayer) {
      if (state.mode === 'pc') {
        const cx = window.innerWidth / 2;
        const cy = window.innerHeight / 2;
        s.targetAngle = Math.atan2(mousePos.y - cy, mousePos.x - cx);
      } else if (joyActive) {
        s.targetAngle = Math.atan2(joyDir.y, joyDir.x);
      }
    } else {
      // Simple AI Steering
      let head = s.segs[0];

      // Avoid world edge
      const distFromCenter = Math.hypot(head.x, head.y);
      if (distFromCenter > WORLD_R - 200) {
        s.targetAngle = Math.atan2(-head.y, -head.x);
      } else if (Math.random() < 0.02) {
        s.targetAngle += (Math.random() - 0.5) * 1.5;
      }
    }

    // Angle interpolation
    let diff = s.targetAngle - s.angle;
    diff = Math.atan2(Math.sin(diff), Math.cos(diff));
    s.angle += diff * Math.min(s.turnSpeed * dt, 1);

    // Boost cost / Mechanics
    const isBoosting = s.boosting && s.segs.length > 10 * SEG_SPACING;
    const speed = isBoosting ? BOOST_SPEED : BASE_SPEED;

    if (isBoosting && Math.random() < 0.3) {
      s.segs.pop(); // Drop length for speed
      if (Math.random() < 0.2) {
        const tail = s.segs[s.segs.length - 1];
        food.push({ x: tail.x, y: tail.y, r: 3, color: s.skin.color });
      }
    }

    // Move Head
    const head = s.segs[0];
    const nx = head.x + Math.cos(s.angle) * speed * dt;
    const ny = head.y + Math.sin(s.angle) * speed * dt;

    // Boundary Check
    if (Math.hypot(nx, ny) > WORLD_R) {
      killSnake(s);
      return;
    }

    s.segs.unshift({ x: nx, y: ny });
    s.segs.pop();
  }

  function checkCollisions() {
    for (let s1 of snakes) {
      if (!s1.alive) continue;
      const head = s1.segs[0];

      for (let s2 of snakes) {
        if (!s2.alive) continue;
        // Don't collide with immediate own head segments
        const startIdx = (s1 === s2) ? 12 : 0;

        for (let i = startIdx; i < s2.segs.length; i += 2) {
          const seg = s2.segs[i];
          if (distSq(head.x, head.y, seg.x, seg.y) < (s1.width + 2) ** 2) {
            killSnake(s1);
            break;
          }
        }
        if (!s1.alive) break;
      }
    }
  }

  function feedCheck(s) {
    if (!s.alive) return;
    const head = s.segs[0];

    // Food
    for (let i = food.length - 1; i >= 0; i--) {
      const f = food[i];
      if (distSq(head.x, head.y, f.x, f.y) < (s.width + f.r) ** 2) {
        food.splice(i, 1);
        // Grow snake
        const tail = s.segs[s.segs.length - 1];
        for (let k = 0; k < SEG_SPACING; k++) s.segs.push({ ...tail });
      }
    }

    // Gems (Player only for tracking)
    if (s.isPlayer) {
      for (let i = gemsWorld.length - 1; i >= 0; i--) {
        const g = gemsWorld[i];
        if (distSq(head.x, head.y, g.x, g.y) < (s.width + g.r) ** 2) {
          gemsWorld.splice(i, 1);
          runGems++;
          state.gemsTotal++;
          saveState();
        }
      }
    }
  }

  function killSnake(s) {
    s.alive = false;
    // Turn segments to food and gems
    for (let i = 0; i < s.segs.length; i += 4) {
      const seg = s.segs[i];
      food.push({
        x: seg.x + (Math.random() - 0.5) * 10,
        y: seg.y + (Math.random() - 0.5) * 10,
        r: 4,
        color: s.skin.color
      });
    }
    if (Math.random() < 0.7) {
      spawnGemsCluster(s.segs[0].x, s.segs[0].y, Math.floor(s.segs.length / 20) + 1);
    }
  }

  function respawnAIIfNeeded() {
    snakes = snakes.filter(s => s.alive || s.isPlayer);
    while (snakes.filter(s => !s.isPlayer).length < AI_COUNT) {
      snakes.push(makeSnake(false, aiName(), SKINS[Math.floor(Math.random() * SKINS.length)].id));
    }
  }

  /* ============ RENDER ============ */
  function drawSnake(s) {
    ctx.save();
    ctx.strokeStyle = s.skin.color;
    ctx.fillStyle = s.skin.color;
    ctx.shadowColor = s.skin.glow;
    ctx.shadowBlur = s.boosting ? 15 : 6;
    ctx.lineWidth = s.width;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    const viewW = window.innerWidth;
    const viewH = window.innerHeight;

    ctx.beginPath();
    for (let i = 0; i < s.segs.length; i += 2) {
      const seg = s.segs[i];
      const sx = seg.x - player.x + viewW / 2;
      const sy = seg.y - player.y + viewH / 2;

      if (i === 0) ctx.moveTo(sx, sy);
      else ctx.lineTo(sx, sy);
    }
    ctx.stroke();

    // Head details (Eyes)
    const head = s.segs[0];
    const hx = head.x - player.x + viewW / 2;
    const hy = head.y - player.y + viewH / 2;

    ctx.fillStyle = '#fff';
    ctx.shadowBlur = 0;

    const eyeOffset = 5;
    const ex1 = hx + Math.cos(s.angle + 0.5) * eyeOffset;
    const ey1 = hy + Math.sin(s.angle + 0.5) * eyeOffset;
    const ex2 = hx + Math.cos(s.angle - 0.5) * eyeOffset;
    const ey2 = hy + Math.sin(s.angle - 0.5) * eyeOffset;

    ctx.beginPath();
    ctx.arc(ex1, ey1, 2.5, 0, Math.PI * 2);
    ctx.arc(ex2, ey2, 2.5, 0, Math.PI * 2);
    ctx.fill();

    // Name tag
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.font = '10px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(s.name, hx, hy - 12);

    ctx.restore();
  }

  function drawFood() {
    const viewW = window.innerWidth;
    const viewH = window.innerHeight;

    for (const f of food) {
      const sx = f.x - player.x + viewW / 2;
      const sy = f.y - player.y + viewH / 2;

      // Cull off-screen
      if (sx < -10 || sx > viewW + 10 || sy < -10 || sy > viewH + 10) continue;

      ctx.fillStyle = f.color;
      ctx.beginPath();
      ctx.arc(sx, sy, f.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawGems() {
    const viewW = window.innerWidth;
    const viewH = window.innerHeight;
    for (const g of gemsWorld) {
      g.t += 0.05;
      const sx = g.x - player.x + viewW / 2;
      const sy = g.y - player.y + viewH / 2 + Math.sin(g.t) * 3;
      if (sx < -20 || sx > viewW + 20 || sy < -20 || sy > viewH + 20) continue;

      ctx.save();
      ctx.translate(sx, sy);
      ctx.rotate(g.t * 0.5);
      ctx.fillStyle = '#e3b74b';
      ctx.shadowColor = '#e3b74b';
      ctx.shadowBlur = 12;

      // Draw gem diamond shape
      ctx.beginPath();
      ctx.moveTo(0, -g.r);
      ctx.lineTo(g.r * 0.8, 0);
      ctx.lineTo(0, g.r);
      ctx.lineTo(-g.r * 0.8, 0);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
    ctx.shadowBlur = 0;
  }

  function drawWorldBoundary() {
    const viewW = window.innerWidth;
    const viewH = window.innerHeight;
    const bx = -player.x + viewW / 2;
    const by = -player.y + viewH / 2;

    ctx.beginPath();
    ctx.arc(bx, by, WORLD_R, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(75, 227, 216, 0.35)';
    ctx.lineWidth = 6;
    ctx.shadowColor = 'rgba(75, 227, 216, 0.5)';
    ctx.shadowBlur = 15;
    ctx.stroke();
    ctx.shadowBlur = 0;
  }

  function drawGrid() {
    const viewW = window.innerWidth;
    const viewH = window.innerHeight;
    const gridSize = 120;
    const offsetX = (-player.x + viewW / 2) % gridSize;
    const offsetY = (-player.y + viewH / 2) % gridSize;

    ctx.strokeStyle = 'rgba(75, 227, 216, 0.04)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = offsetX; x < viewW; x += gridSize) {
      ctx.moveTo(x, 0); ctx.lineTo(x, viewH);
    }
    for (let y = offsetY; y < viewH; y += gridSize) {
      ctx.moveTo(0, y); ctx.lineTo(viewW, y);
    }
    ctx.stroke();
  }

  function updateLeaderboard() {
    const sorted = [...snakes].sort((a, b) => b.segs.length - a.segs.length).slice(0, 5);
    const lb = el('lbList');
    lb.innerHTML = '';
    sorted.forEach((s, idx) => {
      const row = document.createElement('div');
      row.className = 'row-item';
      row.style.fontWeight = s.isPlayer ? '700' : '400';
      row.style.color = s.isPlayer ? 'var(--glow-cyan)' : 'var(--ink)';
      row.innerHTML = `<span>${idx + 1}. ${s.name}</span><span>${Math.floor(s.segs.length / SEG_SPACING)}</span>`;
      lb.appendChild(row);
    });
  }

  /* ============ MAIN GAME LOOP ============ */
  let lastTime = performance.now();

  function gameLoop(now) {
    if (!running) return;
    const dt = Math.min((now - lastTime) / 1000, 0.1);
    lastTime = now;

    // Update
    snakes.forEach(s => updateSnake(s, dt));
    checkCollisions();
    snakes.forEach(s => feedCheck(s));

    if (food.length < FOOD_COUNT) spawnFood(FOOD_COUNT - food.length);
    respawnAIIfNeeded();

    // Render
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawGrid();
    drawWorldBoundary();
    drawFood();
    drawGems();

    snakes.forEach(s => { if (s.alive) drawSnake(s); });

    // Update HUDs
    if (player) {
      const playerLen = Math.floor(player.segs.length / SEG_SPACING);
      el('lenHud').textContent = playerLen;
      el('lenHud').classList.toggle('boosting', player.boosting);
      el('boostTag').style.display = player.boosting ? 'block' : 'none';

      if (!player.alive) {
        endGame(playerLen);
        return;
      }
    }

    updateLeaderboard();
    requestAnimationFrame(gameLoop);
  }

  function startGame() {
    food = [];
    gemsWorld = [];
    snakes = [];
    runGems = 0;

    player = makeSnake(true, state.playerName, state.selectedSkin);
    snakes.push(player);

    spawnFood(FOOD_COUNT);
    for (let i = 0; i < AI_COUNT; i++) {
      snakes.push(makeSnake(false, aiName(), SKINS[Math.floor(Math.random() * SKINS.length)].id));
    }

    hide('menuScreen');
    hide('deathScreen');
    hide('skinsScreen');
    hide('shopScreen');

    show('hud');
    show('gemHud');
    show('leaderboard');

    if (state.mode === 'mobile') {
      show('joystick');
      show('boostBtn');
    } else {
      hide('joystick');
      hide('boostBtn');
    }

    running = true;
    lastTime = performance.now();
    requestAnimationFrame(gameLoop);
  }

  function endGame(finalLen) {
    running = false;
    hide('hud');
    hide('gemHud');
    hide('leaderboard');
    hide('joystick');
    hide('boostBtn');

    el('deathStats').textContent = `Final Length: ${finalLen} — Earned ${runGems} gems`;
    show('deathScreen');
  }

})();
</script>
</body>
</html>
